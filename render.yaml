services:
  - type: web
    name: rahul-ai-mini-pairing
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAIRING_MODE
        value: "true"
      - key: OWNER_NUMBER
        value: "919356730236"
      - key: OWNER_NAME
        value: "rahul-master"
      - key: PREFIX
        value: "."
      - key: BOT_NAME
        value: "RAHUL-AI-MINI"
